[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alembic-viz-contracts"
version = "0.1.0"
description = "Data contracts for alembic-viz components"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["alembic_viz_contracts"]
