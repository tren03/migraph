[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alembic-viz-graph-ops"
version = "0.1.0"
description = "Graph validation and ordering utilities for alembic-viz"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Graph Ops Team"},
]
dependencies = [
    "alembic-viz-contracts",
]

[tool.uv.sources]
alembic-viz-contracts = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["alembic_viz_graph_ops"]
