[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alembic-viz-viewer"
version = "0.1.0"
description = "Browser viewer for alembic-viz graphs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Viewer Team" },
]
dependencies = [
    "alembic-viz-contracts",
    "alembic-viz-graph-ops",
    "alembic-viz-writer",
]

[tool.uv.sources]
alembic-viz-contracts = { workspace = true }
alembic-viz-graph-ops = { workspace = true }
alembic-viz-writer = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["alembic_viz_viewer"]
