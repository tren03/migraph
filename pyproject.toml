[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mviz"
version = "0.1.0"
description = "Alembic Migration Visualizer & Reorganizer"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "libcst>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mviz = "mviz.views.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mviz"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
