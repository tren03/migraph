[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migraph"
version = "0.0.1"
description = "Interactive browser UI for visualizing and rewiring Alembic migration graphs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Vishnu Sethuraman", email = "vishnusethuraman@gmail.com" },
]
keywords = ["alembic", "migrations", "database", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.9.0",
    "libcst>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
migraph = "migraph.views.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/migraph"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
