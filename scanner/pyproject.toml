[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alembic-viz-scanner"
version = "0.1.0"
description = "Scanner module for alembic-viz - parses migration files into GraphState"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Scanner Team"},
]
dependencies = [
    "alembic-viz-contracts",
    "libcst>=1.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[tool.uv.sources]
alembic-viz-contracts = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
alembic-viz-scan = "alembic_viz_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["alembic_viz_scanner"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = []
